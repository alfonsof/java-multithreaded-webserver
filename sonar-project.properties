# Unique project identifier (matches groupId:artifactId in pom.xml)
sonar.projectKey=com.alfonsof.webserver:WebServer
sonar.projectName=Java Multithreaded Webserver
sonar.projectVersion=1.1.2

# Separate paths for main source code and unit/integration tests
sonar.sources=src/main/java
sonar.tests=src/test/java

# Exact paths to compiled bytecode (.class files) generated by Maven
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Source file encoding and target Java version
sonar.sourceEncoding=UTF-8
sonar.java.source=8
